[project]
name = "dataset-studio"
version = "0.1.0"
description = "A local-first editor for arbitrary JSONL datasets"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "django>=5.2,<6",
  "pydantic>=2.11,<3",
  "platformdirs>=4.3",
  "huggingface-hub>=0.34",
  "datasets>=4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-django>=4.11",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "dataset_studio.settings"
pythonpath = ["src"]
testpaths = ["src/datasets_app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "frontend", "src/datasets_app/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_studio", "src/datasets_app", "src/dataset_guard"]
